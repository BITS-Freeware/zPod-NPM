name: Release

# Publishes to npm when a GitHub release tagged v<version> is published.
# Uses npm trusted publishing (OIDC), so no npm token is stored here. The
# very first publish of a new package can't use OIDC yet; for that one run,
# an NPM_TOKEN secret is used if present and should be deleted afterwards.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - name: Check the tag and license
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$version" ]; then
            echo "Release tag $TAG does not match package.json $version." >&2
            exit 1
          fi
          license="$(node -p 'require("./package.json").license')"
          if [ "$license" = "UNLICENSED" ] || [ ! -f LICENSE ]; then
            echo "Choose a license (package.json and LICENSE) before publishing." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
